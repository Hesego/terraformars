version: "3.7"
services:

## --------------------------- TERRAFORMARS --------------------------- ##

  frontend:
    image: haquiceno2489/terraformars-frontend:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - hesegonet

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.terraformars-app.rule=Host(`terraformars.devops.hesegoingenieria.com`)
        - traefik.http.services.terraformars-app.loadbalancer.server.port=3000
        - traefik.http.routers.terraformars-app.service=terraformars-app
        - traefik.http.routers.terraformars-app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.terraformars-app.entrypoints=websecure
        - traefik.http.routers.terraformars-app.tls=true

  backend:
    image: haquiceno2489/terraformars-api:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - terraformars_uploads:/app/uploads
      - terraformars_data:/app/terraform_data

    networks:
      - hesegonet

    environment:
      - PORT=3001
      - NODE_ENV=production
    ## 🗄️ Base de datos (servicio tf-db de este stack)
      - DB_HOST=tf-db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=terraformars
    ## 🔁 Redis (servicio tf-redis de este stack)
      - REDIS_HOST=tf-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ## 🔐 Secretos de la aplicación
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ## 🌐 CORS
      - ALLOWED_ORIGINS=https://terraformars.devops.hesegoingenieria.com
      - FRONTEND_URL=https://terraformars.devops.hesegoingenieria.com

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.terraformars-api.rule=Host(`apiterraformars.devops.hesegoingenieria.com`)
        - traefik.http.services.terraformars-api.loadbalancer.server.port=3001
        - traefik.http.routers.terraformars-api.service=terraformars-api
        - traefik.http.routers.terraformars-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.terraformars-api.entrypoints=websecure
        - traefik.http.routers.terraformars-api.tls=true

  tf-db:
    image: postgres:15-alpine

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - terraformars_db_data:/var/lib/postgresql/data

    networks:
      - hesegonet

    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=terraformars

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  tf-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

    volumes:
      - terraformars_redis_data:/data

    networks:
      - hesegonet

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

## --------------------------- TERRAFORMARS --------------------------- ##

volumes:
  terraformars_db_data:
    name: terraformars_db_data
  terraformars_redis_data:
    name: terraformars_redis_data
  terraformars_uploads:
    name: terraformars_uploads
  terraformars_data:
    name: terraformars_data

networks:
  hesegonet:
    name: hesegonet
    external: true
